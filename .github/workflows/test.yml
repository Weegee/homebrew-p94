# Builds claude-tools from the tarball of the current release and runs its test block.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Homebrew is preinstalled on ubuntu-latest (ubuntu-24.04) at /home/linuxbrew/.linuxbrew, but not on PATH:
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
      - name: Put Homebrew on PATH
        run: |
          prefix=/home/linuxbrew/.linuxbrew
          test -x "$prefix/bin/brew"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "$prefix/sbin" >> "$GITHUB_PATH"
          echo "HOMEBREW_NO_ANALYTICS=1" >> "$GITHUB_ENV"

      - name: Tap the checked-out repository
        run: |
          brew tap weegee/p94 "$GITHUB_WORKSPACE"
          brew trust --tap weegee/p94

      - name: Build claude-tools from source
        run: brew install --build-from-source weegee/p94/claude-tools

      - name: Test claude-tools
        run: brew test weegee/p94/claude-tools
